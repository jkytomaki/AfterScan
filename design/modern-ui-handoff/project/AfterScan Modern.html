<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AfterScan — Modernized</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { background: #0d0c0b; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .stage {
    width: 1440px; height: 900px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 30px 80px rgba(0,0,0,0.6);
    position: relative;
  }
  @media (max-width: 1500px) {
    body { padding: 0; }
    .stage { width: 100vw; height: 100vh; border-radius: 0; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="inspectors.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
